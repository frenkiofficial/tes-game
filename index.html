<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AQUATER MOBA 3D - Mobile Legends Web Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Engine & GLTFLoader untuk load model 3D nyata -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PERINGATAN NGAJAK POPUP LANDSCAPE JIKA HP DI-HOLD VERTIKAL -->
    <div id="landscape-warning" class="hidden fixed inset-0 z-50 bg-slate-950 flex-col items-center justify-center p-6 text-center text-white">
        <i class="fa-solid fa-mobile-screen-button text-5xl text-cyan-400 animate-bounce mb-4"></i>
        <h2 class="text-xl font-bold mb-2">Miringkan HP Anda (Landscape)</h2>
        <p class="text-xs text-slate-400">Untuk pengalaman bermain MOBA 3D seperti Mobile Legends, aktifkan Auto-Rotate dan posisikan layar secara miring.</p>
    </div>

    <div id="game-container">
        <!-- CANVAS THREE.JS GAME -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD OVERLAY MOBA MOBILE -->
        <div class="hud-layer">
            
            <!-- MINIMAP KIRI ATAS -->
            <div class="minimap-box hud-element">
                <canvas id="minimap-canvas" width="110" height="110"></canvas>
            </div>

            <!-- SCORE BAR TENGAH ATAS -->
            <div class="top-scorebar hud-element">
                <span class="text-blue-400">4</span>
                <span class="text-xs text-slate-400 font-mono">02:15</span>
                <span class="text-red-500">2</span>
            </div>

            <!-- VOUCHER AQUATER & PROFILE KANAN ATAS -->
            <div class="absolute top-3 right-3 flex items-center gap-2 hud-element">
                <div class="bg-slate-900/90 border border-cyan-500/50 px-3 py-1 rounded-full flex items-center gap-1.5 text-xs text-yellow-400 font-bold">
                    <i class="fa-solid fa-ticket"></i>
                    <span id="voucher-num">0</span>/7
                </div>
                <button onclick="alert('Menu Voucher & Login Firebase')" class="bg-cyan-600 px-3 py-1 rounded-full text-xs font-bold text-white">
                    Voucher
                </button>
            </div>

            <!-- CONTROLS JOYSTICK KIRI BAWAH -->
            <div id="joystick-container" class="joystick-outer hud-element">
                <div id="joystick-handle" class="joystick-inner"></div>
            </div>

            <!-- SKILL CLUSTER KANAN BAWAH (ML BB LAYOUT) -->
            <div class="skill-cluster hud-element">
                <!-- Main Attack -->
                <button id="btn-attack" class="btn-attack">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
                <!-- Skill 1 (Q) -->
                <button id="btn-skill-1" class="btn-skill w-12 h-12 bottom-20 right-2 text-xs">
                    Q
                </button>
                <!-- Skill 2 (W) -->
                <button id="btn-skill-2" class="btn-skill w-12 h-12 bottom-20 right-16 text-xs">
                    W
                </button>
                <!-- Skill 3 (E / Dash) -->
                <button id="btn-skill-3" class="btn-skill w-11 h-11 bottom-3 right-20 text-xs">
                    E
                </button>
                <!-- Ultimate (R) -->
                <button id="btn-ult" class="btn-skill w-14 h-14 bottom-28 right-10 text-sm border-red-500 text-red-400">
                    R
                </button>
            </div>

        </div>
    </div>

    <!-- MAIN GAME SCRIPT -->
    <script src="main.js"></script>
</body>
</html>
